name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to VPS
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avzr --delete
            --exclude=.git
            --exclude=.github
            --exclude=node_modules
            --exclude=.next
            --exclude=.env
            --exclude=.yoke
            --exclude=tsconfig.tsbuildinfo
          path: ./
          remote_path: /var/www/digi-profilo
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Install, build, and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/digi-profilo
            yarn install --frozen-lockfile
            yarn build
            pm2 restart digi-profilo
